services:
  fvi-edge-server:
    build: .
    container_name: fvi_inspection_server
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      # Live bind-mount so code & UI updates reflect immediately without stale volume caching
      - .:/app
      - ./el_cache:/app/el_cache
    # extra_hosts:
    #   # Optional: map custom hostnames to plant server IPs if DNS is not available
    #   - "cmms-auth:${CMMS_HOST:-localhost}"
    #   - "mes-mqtt:${MQTT_BROKER:-localhost}"

  # Optional free HTTPS tunnel for remote/tablet access (start with: docker compose --profile tunnel up -d)
  cloudflared-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: fvi_cloudflared_tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - fvi-edge-server
    command: tunnel --no-autoupdate --url http://fvi-edge-server:8080
